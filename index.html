<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZİFİR</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:system-ui,"Segoe UI",Ubuntu,sans-serif}
  #sahne{position:fixed;inset:0;display:block}
  #arayuz{position:fixed;inset:0;pointer-events:none;user-select:none}
  #arayuz .tik{pointer-events:auto}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="sahne"></canvas>
<div id="arayuz"></div>
<script type="module">
// Mobil tarayıcı fiziksel yön kilidini reddetse de oyun yatay koordinatlarda çalışır.
const mobil = matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0;
const cocuk = new URLSearchParams(location.search).has('yatay');
if (mobil && !cocuk && window.parent === window) {
  document.getElementById('sahne').remove();
  document.getElementById('arayuz').remove();
  const cerceve = document.createElement('iframe');
  cerceve.title = 'ZİFİR yatay oyun';
  cerceve.allow = 'fullscreen; gamepad';
  cerceve.allowFullscreen = true;
  const adres = new URL(location.href); adres.searchParams.set('yatay', '1');
  cerceve.src = adres.href;
  cerceve.style.cssText = 'position:fixed;left:0;top:0;border:0;display:block;transform-origin:0 0';
  document.body.append(cerceve);
  function boyutla() {
    const portre = innerHeight > innerWidth;
    cerceve.style.width = (portre ? innerHeight : innerWidth) + 'px';
    cerceve.style.height = (portre ? innerWidth : innerHeight) + 'px';
    cerceve.style.transform = portre ? 'translateX(' + innerWidth + 'px) rotate(90deg)' : 'none';
  }
  addEventListener('resize', boyutla); boyutla();
  window.zifirTamEkran = async () => {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.(); } catch {}
    try { await screen.orientation?.lock?.('landscape'); } catch {}
    boyutla();
  };
  // İlk dokunuşta; tarayıcı fullscreen için gerçek kullanıcı hareketi ister.
  document.addEventListener('pointerdown', window.zifirTamEkran, { once: true });
} else {
  await import('./js/oyun.js');
}
</script>
</body>
</html>
